[project]
name = "mini-pi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "prompt-toolkit==3.0.53",
    "pydantic>=2,<3",
    "rich==14.2.0",
]

[build-system]
requires = ["uv_build==0.11.14"]
build-backend = "uv_build"

[project.scripts]
mini-pi = "mini_pi.cli:main"
